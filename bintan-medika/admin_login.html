<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Staf &amp; Admin — Bintan Medika</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="auth-body auth-body--solo">
<section class="auth-form auth-form--card">
  <div class="brand"><span class="brand__mark"><img src="assets/img/logo.png" alt=""></span><span><span class="brand__name" style="display:block">Bintan Medika</span><span class="brand__tag" style="display:block">Panel staf</span></span></div>
  <h2 class="auth-title">Masuk ke panel admin</h2>
  <p class="auth-sub">Gunakan akun staf apoteker Anda.</p>
  <form id="formAdminLogin" class="authform" action="dashboard.html" method="get">
    <label class="field"><span class="field__label">ID karyawan atau email</span><input type="text" name="identifier" placeholder="admin@bintanmedika.com" required></label>
    <label class="field"><span class="field__label">Kata sandi</span><input type="password" name="password" placeholder="••••••••" required></label>
    <div class="field-row"><label class="checkbox"><input type="checkbox" name="remember"><span>Ingat saya</span></label><a href="#" class="link">Bantuan akses</a></div>
    <button type="submit" class="btn btn-primary auth-submit">Masuk</button>
    <p class="authform__hint">Bukan staf? <a href="index.html" class="link link--strong">Kembali ke etalase</a></p>
  </form>
</section>
</body>
</html>
